name: Console privacy regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  console-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/console-privacy.test.cjs
